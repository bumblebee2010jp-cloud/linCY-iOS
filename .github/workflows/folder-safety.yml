name: Native folder safety tests
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_folder_sync.py
      - run: python3 scripts/run_ios_tests.py
